[tool.poetry]
name = "apexline"
version = "0.1.0"
description = "Apexline (極速對決): a 3D race against an AI on one screen, side by side, on ten tracks. The AI is the model the AI Hub sets for this app: it plans a speed for every corner and how hard to race you, and changes the plan after every lap. For *.reflex-ddns.com."
authors = ["Milo Chen"]
license = "MIT"
readme = "README.md"
packages = [{include = "apexline"}]
include = ["apexline/data/tracks/*.json"]

[tool.poetry.dependencies]
# Developed on 3.15; 3.11 stays allowed for the re_ddns App Store image (python:3.11).
python = ">=3.11,<3.16"
reflex = "0.10.0"
# The AI racer: the AI Hub's models (reflex_ddns_auth.ai); the game holds no model or key.
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
httpx = ">=0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
playwright = "^1.42.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
